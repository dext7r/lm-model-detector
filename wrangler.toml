# Git 部署默认使用免登录模式，不需要 KV 或 Turnstile。
# name 应与 Cloudflare 关联的 Worker 名称一致。
name = "lm-model"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
# 由 Worker 统一处理 API、SEO 文件和页面回退。
run_worker_first = true

[observability]
enabled = false
