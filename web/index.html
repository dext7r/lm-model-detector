<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070B10" />
  <meta name="format-detection" content="telephone=no" />
  <!-- SEO 占位：生产环境由 worker 按请求域名注入 TDK / OG / canonical，
       下面这几行是纯静态部署或本地开发时的兜底值 -->
  <!--seo-->
  <title>LM 模型指纹检测 · 识别 API 背后的真实模型</title>
  <meta name="description" content="通过采样接口返回的数字序列，识别 API 背后真实调用的语言模型。浏览器内计算评分，支持批量检测与可选的账户存储。" />
  <!-- 在首屏渲染前定好主题，避免深色闪成浅色 -->
  <script>
    (function () {
      try {
        var mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = mode
        document.documentElement.style.colorScheme = mode
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', mode === 'light' ? '#f3f7fb' : '#070B10')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    })()
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23070B10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232FE3B0' stroke-width='1.5' opacity='.45'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232FE3B0'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
